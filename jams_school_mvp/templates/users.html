{% extends 'base.html' %}{% block body %}<h1>Pengurusan pengguna</h1><section class="panel"><h2>Tambah pengguna</h2><form method="post"><label>Nama<input name="name" required></label><label>E-mel<input name="email" type="email" required></label><label>Kata laluan sementara (min. 10 aksara)<input name="password" type="password" minlength="10" required></label><fieldset><legend>Peranan (boleh lebih daripada satu)</legend>{% for role in ROLES %}<label class="check"><input type="checkbox" name="roles" value="{{role}}"> {{role}}</label>{% endfor %}</fieldset><button>Tambah pengguna</button></form></section><section class="panel"><h2>Akaun</h2>{% for u in items %}<p>{{u.name}} • {{u.email}} • <small>{{u.roles}}</small></p>{% endfor %}</section>{% endblock %}
