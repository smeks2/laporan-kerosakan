{% extends 'base.html' %}{% block body %}<section class="panel"><h1>Laporan kerosakan baharu</h1><form method="post" enctype="multipart/form-data"><label>Lokasi daripada Buku Prestij 2026<select name="location_id"><option value="">-- Pilih lokasi / gunakan lokasi manual --</option>{% for l in locations %}<option value="{{l.id}}">{{l.zone}} • {{l.code}} • {{l.label}}</option>{% endfor %}</select></label><label>Lokasi manual (jika belum tersenarai)<input name="manual_location" placeholder="Contoh: Blok A, aras 1, bilik..." maxlength="200"></label><label>Aset / komponen<input name="asset" placeholder="Contoh: Lampu, suis, pintu, paip" maxlength="150"></label><label>Keterangan kerosakan<textarea name="description" required rows="5" maxlength="3000"></textarea></label><label>Keutamaan<select name="priority"><option>SEDERHANA</option><option>RENDAH</option><option>TINGGI</option><option>KRITIKAL</option></select></label><label>Gambar bukti (maksimum 5; JPG, PNG, WebP)<input type="file" name="photos" accept="image/jpeg,image/png,image/webp" multiple></label><button>Hantar laporan</button></form></section>{% endblock %}
